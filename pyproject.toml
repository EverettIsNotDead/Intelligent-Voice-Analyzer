[project]
name = "intelligent-voice-analyzer"
version = "0.1.0"
description = "Gender and speaker recognition from uploaded or live voice recordings"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "sounddevice>=0.5,<1",
  "soundfile>=0.12,<1",
  "librosa>=0.10,<1",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
